{{- if .Values.authProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend.fullname" . }}-auth-proxy
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-proxy
spec:
  ports:
    - name: upstream
      port: {{ .Values.authProxy.upstreamPort }}
      protocol: TCP
      targetPort: {{ .Values.authProxy.upstreamPort }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ include "frontend.fullname" . }}-auth-proxy
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-proxy
    kubernetes.io/service-name: {{ include "frontend.fullname" . }}-auth-proxy
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.authProxy.upstreamAddress | quote }}
ports:
  - name: upstream
    port: {{ .Values.authProxy.upstreamPort }}
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "frontend.fullname" . }}-auth-proxy
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-proxy
  {{- with .Values.authProxy.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.authProxy.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.authProxy.host | quote }}
      secretName: {{ .Values.authProxy.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.authProxy.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "frontend.fullname" . }}-auth-proxy
                port:
                  name: upstream
{{- end }}
