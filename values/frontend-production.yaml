image:
  tag: 1.16.25
env:
  APPWRITE_SEPA_MANDATES_COLLECTION_ID: "sepa_mandates"
authProxy:
  enabled: true
  host: auth.colibrie.eu
  upstreamAddress: 91.99.97.36
  upstreamPort: 443
  ingress:
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
      nginx.ingress.kubernetes.io/proxy-ssl-name: auth.colibrie.eu
      nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
      nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    tlsSecretName: auth.colibrie.eu-tls
ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "16"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "128k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "32"
    nginx.ingress.kubernetes.io/upstream-keepalive-requests: "100"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "30"
    nginx.ingress.kubernetes.io/server-snippet: |
      error_page 502 503 504 = @custom_error;

      location @custom_error {
        default_type application/json;
        return 502 '{"success": false, "error": "the upstream service is unavailable"}';
      }
    cert-manager.io/cluster-issuer: letsencrypt-prod
  className: nginx
  hosts:
    - host: app.colibrie.eu
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: app.colibrie.eu-tls
      hosts:
        - app.colibrie.eu
podAnnotations:
  deploy-timestamp: "2026-08-26T16:36:48Z"
resources:
  requests:
    cpu: "10m"
    memory: "128Mi"
  limits:
    cpu: "100m"
    memory: "512Mi"
